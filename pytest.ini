[pytest]
# The suite is tiered by cost, not by topic: the fast tier reads shipped
# archives and takes seconds, the slow tier re-solves the pipeline and takes
# minutes.  Continuous integration runs the fast tier only, so the marker has to
# exist and be registered -- an unregistered marker is a warning that silently
# becomes a typo ("-m slow" deselects nothing).
markers =
    slow: re-runs the simulation or the entry point; deselected by default in CI

# Where the tests live, so that a bare `pytest` from the repository root means
# the suite rather than whatever else has test_*.py in it.  rootdir itself is
# not an ini option: it is decided by finding this file, which is why the file is
# at the repository root.
testpaths = tests
